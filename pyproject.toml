[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot"
version = "0.2.1"
description = "AI-assisted job discovery, matching, resume tailoring, and application tracking"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
jobpilot = "services.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["services", "services.*"]
exclude = ["tests", "tests.*", "resume", "resume.*", "prompts", "database"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
