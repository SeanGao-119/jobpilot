[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot"
version = "0.6.0"
description = "AI-assisted job discovery, matching, resume tailoring, and application tracking"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.0",
  "google-auth-oauthlib>=1.0",
  "html2text>=2024.0",
  "httpx>=0.28",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
jobpilot = "services.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["services", "services.*"]
exclude = ["tests", "tests.*", "resume", "resume.*", "prompts", "database"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"services/ingestion/gmail_seek.py" = ["BLE001"]
"services/ingestion/seek_job.py" = ["TRY004"]
"services/pipeline/daily.py" = ["BLE001"]
