<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JobPilot SEEK Sync</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="eyebrow">JobPilot</div>
      <h1>SEEK Saved Jobs</h1>
      <p id="status" class="status">Open your SEEK Saved Jobs page, then sync.</p>
      <button id="sync" type="button">Sync Saved Jobs</button>
      <div id="result" class="result" hidden></div>
      <p class="hint">Only SEEK job URLs are sent to your local JobPilot receiver.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
